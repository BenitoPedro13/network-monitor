services:
  postgres:
    image: postgres:16-alpine
    container_name: network_monitor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-network_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-network_monitor}
      POSTGRES_DB: ${POSTGRES_DB:-network_monitor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-network_monitor} -d ${POSTGRES_DB:-network_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: network_monitor_adguardhome
    restart: unless-stopped
    # host networking (requires Docker Desktop "Enable host networking") so
    # AdGuard sees stable client source IPs instead of NAT-rewritten ones;
    # binds host ports 53 (DNS) and 3000 (web UI) directly
    network_mode: host
    volumes:
      - ./adguardhome/work:/opt/adguardhome/work
      - ./adguardhome/conf:/opt/adguardhome/conf

  grafana:
    image: grafana/grafana:latest
    container_name: network_monitor_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-network_monitor}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER:-network_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-network_monitor}
      POSTGRES_DB: ${POSTGRES_DB:-network_monitor}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:
